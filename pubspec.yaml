name: cinemahub
description: "CinemaHub — a private streaming platform for approved friends. Premium cinematic UI, Firebase auth, TMDB catalogue, Stremio-compatible providers, and cloud APK builds."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.2.0

  # State management
  provider: ^6.1.5

  # Networking & caching
  dio: ^5.8.0
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # Playback & Web Embeds
  video_player: ^2.9.1
  chewie: ^1.7.5
  flutter_inappwebview: ^6.2.0-beta.3

  # UI & system integration
  flutter_svg: ^2.0.9
  shimmer: ^4.0.0
  lottie: ^3.8.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/animations/
    - assets/branding/
