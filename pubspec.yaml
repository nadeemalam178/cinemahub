name: cinemahub
description: "CinemaHub — a private streaming platform for approved friends. Premium cinematic UI, Firebase auth, TMDB catalogue, Stremio-compatible providers, and cloud APK builds."
publish_to: 'none'

version: 1.4.0+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0

  # State management & routing
  provider: ^6.1.5
  go_router: ^18.1.4

  # Networking & caching
  dio: ^5.8.0
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  sqlite3: ^3.9.1
  drift: ^2.24.0

  # Playback
  video_player: ^2.9.1
  chewie: ^1.7.5

  # UI polish
  flutter_svg: ^2.0.9
  shimmer: ^4.0.0
  lottie: ^3.8.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  in_app_review: ^2.0.9
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/animations/
    - assets/branding/

  # Fonts are included in pubspec without the `flutter.fonts` property for portability
  # between the local sample and the deployed package.